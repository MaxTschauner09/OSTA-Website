<header class="site-header">
  <div class="container">
    <a href="index.html" class="brand">
      <img class="brand-mark" src="assets/images/logo-icon.png" alt="" width="30" height="30">
      OSTA KI-Services
    </a>
    <nav class="nav" aria-label="Hauptnavigation">

    </nav>

      <button class="nav-toggle" type="button" aria-label="Menü öffnen" aria-expanded="false" aria-controls="mobile-nav">

    <a href="dashboard.html">Mein Konto</a>
  </div>

<main id="gate">
  <div class="gate-loading">Wird geladen …</div>
</main>

<template id="admin-template">
  <section style="padding-bottom: 0;">
    <div class="container">
      <div class="dash-header">
        <div class="section-head" style="margin-bottom: 0;">
          <h2>Admin-Dashboard</h2>
          <p class="dash-email" id="dash-email"></p>
        </div>
        <button class="btn btn-ghost" id="logout-btn">Abmelden</button>
      </div>

      <div class="stat-grid">
        <div class="stat-card">
          <span class="stat-label">Besuche gesamt</span>
          <span class="stat-value" id="stat-views">–</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Registrierte Konten</span>
          <span class="stat-value" id="stat-users">–</span>
        </div>
        <div class="stat-card is-live">
          <span class="stat-label"><span class="stat-live-dot"></span>Gerade aktiv</span>
          <span class="stat-value" id="stat-live">–</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Aktive Abos</span>
          <span class="stat-value" id="stat-subs">–</span>
        </div>
      </div>
    </div>
  </section>

  <section>
    <div class="container">
      <div class="section-head">
        <h2>Abonnements</h2>
        <p>Alle Kunden-Abos im Überblick.</p>
      </div>
      <div id="subs-wrap"></div>
    </div>
  </section>
</template>

<footer class="site-footer">
  <div class="container footer-row">
    <div>
      <div class="footer-brand">OSTA KI-Services</div>

    </div>
    <nav class="footer-links" aria-label="Rechtliches">
      <a href="impressum.html">Impressum</a>
      <a href="agb.html">AGB</a>
      <a href="datenschutz.html">Datenschutz</a>
    </nav>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/auth-guard.js"></script>
<script>
  (async function () {
    var session = await window.osta.requireAdmin();
    if (!session) return;

    var db = window.osta.supabase;
    var gate = document.getElementById("gate");
    var tpl = document.getElementById("admin-template");
    gate.innerHTML = "";
    gate.appendChild(tpl.content.cloneNode(true));

    document.getElementById("dash-email").textContent = session.user.email;
    document.getElementById("logout-btn").addEventListener("click", function () {
      window.osta.logout();
    });

    var { count: viewCount } = await db.from("page_views").select("*", { count: "exact", head: true });
    document.getElementById("stat-views").textContent = viewCount != null ? viewCount : "0";

    var { count: userCount } = await db.from("profiles").select("*", { count: "exact", head: true });
    document.getElementById("stat-users").textContent = userCount != null ? userCount : "0";

    var { data: subs, count: subCount } = await db
      .from("subscriptions")
      .select("*, profiles(email)", { count: "exact" })
      .order("created_at", { ascending: false });

    var activeCount = (subs || []).filter(function (s) { return s.status === "active"; }).length;
    document.getElementById("stat-subs").textContent = activeCount;

    var wrap = document.getElementById("subs-wrap");
    if (!subs || subs.length === 0) {
      wrap.innerHTML = '<div class="empty-state"><p>Noch keine Abonnements — sobald die Zahlungsanbindung live ist, erscheinen Kunden-Abos hier automatisch.</p></div>';
    } else {
      var rows = subs.map(function (s) {
        var email = (s.profiles && s.profiles.email) || s.user_id;
        var periodEnd = s.current_period_end ? new Date(s.current_period_end).toLocaleDateString("de-DE") : "–";
        return (
          "<tr>" +
          "<td>" + email + "</td>" +
          "<td>" + s.product + "</td>" +
          '<td><span class="status-badge status-' + s.status + '">' + s.status + "</span></td>" +
          "<td>" + periodEnd + "</td>" +
          "<td>" + (s.cancel_at_period_end ? "Ja" : "Nein") + "</td>" +
          "</tr>"
        );
      }).join("");

      wrap.innerHTML =
        '<div class="data-table-wrap"><table class="data-table"><thead><tr>' +
        "<th>Kunde</th><th>Produkt</th><th>Status</th><th>Läuft bis</th><th>Gekündigt</th>" +
        "</tr></thead><tbody>" + rows + "</tbody></table></div>";
    }

    // Live visitor count via the same presence channel every page joins.
    var channel = db.channel("osta-presence", { config: { presence: { key: "admin-" + session.user.id } } });
    channel.on("presence", { event: "sync" }, function () {
      var state = channel.presenceState();
      document.getElementById("stat-live").textContent = Object.keys(state).length;
    });
    channel.subscribe(function (status) {
      if (status === "SUBSCRIBED") {
        channel.track({ online_at: new Date().toISOString(), admin: true });
      }
    });
  })();
</script>
<script src="assets/js/main.js"></script>
</body>
</html>
