<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/auth-guard.js"></script>
<script>
  (async function () {
    var session = await window.osta.requireAuth("login.html");
    if (!session) return;

    var gate = document.getElementById("gate");
    var tpl = document.getElementById("dashboard-template");
    gate.innerHTML = "";
    gate.appendChild(tpl.content.cloneNode(true));

    document.getElementById("dash-email").textContent = session.user.email;
    document.getElementById("logout-btn").addEventListener("click", function () {
      window.osta.logout();
    });

    var { data: profile } = await window.osta.supabase
      .from("profiles")
      .select("role")
      .eq("id", session.user.id)
      .single();
    if (profile && profile.role === "admin") {
      document.getElementById("admin-link").hidden = false;
    }

    var statusLabels = {
      active: "Aktiv",
      inactive: "Inaktiv",
      past_due: "Zahlung überfällig",
      canceled: "Gekündigt"
    };

    var productLabels = {
      "email-responder": "Automatischer E-Mail-Responder"
    };

    var { data: subs } = await window.osta.supabase
      .from("subscriptions")
      .select("*")
      .eq("user_id", session.user.id)
      .order("created_at", { ascending: false });

    var list = document.getElementById("sub-list");

    if (!subs || subs.length === 0) {
      list.innerHTML =
        '<div class="empty-state">' +
        '<p>Sie haben aktuell kein Abonnement.</p>' +
        '<a href="produkte.html" class="btn btn-primary">Produkte entdecken</a>' +
        '</div>';
      return;
    }

    subs.forEach(function (sub) {
      var card = document.createElement("div");
      card.className = "sub-card";

      var name = productLabels[sub.product] || sub.product;
      var statusText = statusLabels[sub.status] || sub.status;
      var metaText = "";
      if (sub.status === "active" && sub.cancel_at_period_end && sub.current_period_end) {
        metaText = "Gekündigt — läuft bis " + new Date(sub.current_period_end).toLocaleDateString("de-DE");
      } else if (sub.status === "active" && sub.current_period_end) {
        metaText = "Nächste Abbuchung am " + new Date(sub.current_period_end).toLocaleDateString("de-DE");
      } else if (sub.status === "canceled") {
        metaText = "Zugriff beendet";
      }

      card.innerHTML =
        '<div>' +
        '<h3>' + name + '</h3>' +
        '<p class="sub-meta">' + metaText + '</p>' +
        '</div>' +
        '<span class="status-badge status-' + sub.status + '">' + statusText + '</span>';

      if (sub.status === "active" && !sub.cancel_at_period_end) {
        var cancelBtn = document.createElement("button");
        cancelBtn.className = "btn btn-ghost";
        cancelBtn.textContent = "Kündigen";
        cancelBtn.addEventListener("click", function () {
          alert("Die Kündigungs-Funktion wird aktiv, sobald die Zahlungsanbindung eingerichtet ist.");
        });
        card.appendChild(cancelBtn);
      }

      list.appendChild(card);
    });
  })();
</script>
